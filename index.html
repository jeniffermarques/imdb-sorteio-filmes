<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sorteio - Top 250 IMDb</title>
<style>
  :root {
    --bg: #0d0d0f;
    --card: #17171b;
    --gold: #f5c518; /* IMDb yellow */
    --text: #f2f2f2;
    --muted: #9a9a9f;
    --green: #2ecc71;
    --red: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #1c1c22, #0d0d0f 60%);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: -0.5px;
  }
  h1 span { color: var(--gold); }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .stage {
    background: var(--card);
    border-radius: 18px;
    padding: 28px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    border: 1px solid #2a2a30;
    text-align: center;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .placeholder { color: var(--muted); font-size: 0.95rem; }
  .rank-badge {
    display: inline-block;
    background: var(--gold);
    color: #111;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  .movie-title {
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .movie-original {
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
    margin-bottom: 6px;
  }
  .movie-year {
    color: var(--muted);
    font-size: 1.05rem;
    margin-bottom: 18px;
  }
  .imdb-link {
    color: var(--gold);
    text-decoration: none;
    font-size: 0.85rem;
    border: 1px solid #3a3a40;
    padding: 6px 14px;
    border-radius: 20px;
    display: inline-block;
    width: fit-content;
    margin: 0 auto;
    transition: 0.15s;
  }
  .imdb-link:hover { background: #23232a; }

  .spinning .movie-title, .spinning .stars, .spinning .actions { filter: blur(2px); opacity: 0.6; pointer-events: none; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .draw-btn {
    width: 100%;
    margin-top: 22px;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 14px;
    background: var(--gold);
    color: #111;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    box-shadow: 0 6px 0 #b3900e;
  }
  .draw-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b3900e; }
  .draw-btn:disabled { opacity: 0.6; cursor: default; }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .actions button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 600;
    background: #202026;
    color: var(--text);
    border: 1px solid #2f2f36;
  }
  .actions button:hover { background: #26262d; }
  .actions .watched-btn.on { background: var(--green); color: #06210f; border-color: var(--green); }

  .stars {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
  }
  .star-wrap {
    position: relative;
    display: inline-block;
    width: 1.9rem;
    height: 1.9rem;
    font-size: 1.9rem;
    line-height: 1;
  }
  .star-bg, .star-fill {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
  .star-bg { color: #3a3a42; }
  .star-fill { color: var(--gold); width: 0%; overflow: hidden; }
  .star-half {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    opacity: 0;
  }
  .star-half.left { left: 0; }
  .star-half.right { right: 0; }
  .star-wrap:hover { transform: scale(1.1); transition: transform 0.1s ease; }
  .rating-label {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 1.1em;
  }

  .recent {
    margin-top: 26px;
    background: var(--card);
    border: 1px solid #2a2a30;
    border-radius: 14px;
    padding: 16px 18px;
  }
  .recent h2 {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .recent-empty { color: var(--muted); font-size: 0.85rem; }
  .recent-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid #24242a;
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-info { min-width: 0; }
  .recent-title {
    font-size: 0.92rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .recent-meta {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .recent-stars {
    font-size: 0.85rem;
    color: var(--gold);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    margin-top: 26px;
    background: var(--card);
    border: 1px solid #2a2a30;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .stats b { color: var(--text); font-size: 1rem; }

  .footer-actions {
    display: flex;
    justify-content: center;
    margin-top: 16px;
  }
  .reset-link {
    background: none;
    color: var(--muted);
    font-size: 0.8rem;
    text-decoration: underline;
  }
  .reset-link:hover { color: var(--red); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f1f24;
    border: 1px solid #34343c;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .toast.show { opacity: 1; }

  /* Telas pequenas (celulares) */
  @media (max-width: 420px) {
    body { padding: 16px 10px 40px; }
    h1 { font-size: 1.25rem; }
    .subtitle { font-size: 0.82rem; margin-bottom: 18px; }
    .stage { padding: 20px 14px; min-height: 200px; }
    .movie-title { font-size: 1.3rem; }
    .movie-year { font-size: 0.95rem; margin-bottom: 14px; }
    .draw-btn { padding: 15px; font-size: 1rem; }
    .stats { flex-direction: column; gap: 6px; padding: 12px 16px; }
    .actions { flex-direction: column; }
    .star-wrap { width: 2.3rem; height: 2.3rem; font-size: 2.3rem; }
    .recent { padding: 14px 14px; }
    .recent-title { font-size: 0.88rem; }
  }

  /* Telas muito estreitas */
  @media (max-width: 340px) {
    .movie-title { font-size: 1.15rem; }
    .star-wrap { width: 2rem; height: 2rem; font-size: 2rem; }
  }

  /* Evita que o hover "gigante" do desktop grude em telas de toque */
  @media (hover: none) {
    .star-wrap:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Os 250 melhores filmes do <span>IMDb</span></h1>
  <div class="subtitle">Conforme avaliado pelos eleitores regulares do IMDb — clique e sorteie o próximo</div>

      <div class="actions">
        <button class="watched-btn" id="watchedBtn">☐ Marcar como assistido</button>
      </div>
      <div class="stars" id="stars">
        <span class="star-wrap" data-pos="1">

        <span class="star-wrap" data-pos="4">

          <button class="star-half left" data-value="3.5" aria-label="3.5 estrelas"></button>
          <button class="star-half right" data-value="4" aria-label="4 estrelas"></button>
        </span>
        <span class="star-wrap" data-pos="5">
          <span class="star-bg">★</span><span class="star-fill">★</span>
          <button class="star-half left" data-value="4.5" aria-label="4.5 estrelas"></button>
          <button class="star-half right" data-value="5" aria-label="5 estrelas"></button>
        </span>
      </div>
      <div class="rating-label" id="ratingLabel"></div>
    </div>
  </div>

  <button class="draw-btn" id="drawBtn">🎲 Sortear filme</button>

  <div class="stats">
    <div>Assistidos: <b id="watchedCount">0</b> / 250</div>
    <div>Restantes: <b id="remainingCount">250</b></div>
  </div>

  <div class="recent" id="recentBox">
    <h2>Últimos assistidos</h2>
    <div id="recentList"><div class="recent-empty">Você ainda não marcou nenhum filme como assistido.</div></div>
  </div>

  <div class="footer-actions">
    <button class="reset-link" id="resetBtn">Limpar lista de assistidos</button>
  </div>
</div>

<div class="toast" id="toast"></div>

const STORAGE_KEY = 'watched-movies-v2';
const LEGACY_KEY = 'watched-movies-v1';
// watched: Map idx(number) -> { rating: 0-5, watchedAt: ISOString }
let watched = new Map();
let current = null; // {idx, rank, original, ptTitle, year}

const stage = document.getElementById('stage');
const placeholder = document.getElementById('placeholder');
const resultBox = document.getElementById('result');
const rankEl = document.getElementById('rank');
const titleEl = document.getElementById('title');
const originalEl = document.getElementById('original');
const yearEl = document.getElementById('year');
const imdbLink = document.getElementById('imdbLink');
const drawBtn = document.getElementById('drawBtn');
const watchedBtn = document.getElementById('watchedBtn');
const resetBtn = document.getElementById('resetBtn');
const watchedCountEl = document.getElementById('watchedCount');
const remainingCountEl = document.getElementById('remainingCount');
const toast = document.getElementById('toast');
const starsBox = document.getElementById('stars');
const starWraps = Array.from(starsBox.querySelectorAll('.star-wrap'));
const ratingLabel = document.getElementById('ratingLabel');
const recentList = document.getElementById('recentList');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

async function loadWatched() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      watched = new Map(Object.entries(JSON.parse(raw)).map(([k, v]) => [Number(k), v]));
    } else {
      // tenta migrar do formato antigo (apenas lista de índices, sem nota/data)
      const legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy) {
        const idxs = JSON.parse(legacy);
        idxs.forEach(i => watched.set(i, { rating: 0, watchedAt: null }));
        saveWatched({ silent: true });
      }
    }
  } catch (e) {
    // navegador sem localStorage disponível (raro): segue com a lista vazia nesta sessão
    watched = new Map();
  }
  updateStats();
  renderRecent();
}

// Salva no localStorage do navegador — os dados ficam só neste
// navegador/dispositivo, não sincronizam entre aparelhos diferentes.
function saveWatched(opts = {}) {
  const { silent = false } = opts;
  try {
    const obj = {};
    watched.forEach((v, k) => { obj[k] = v; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
    return true;
  } catch (e) {
    if (!silent) showToast('Não consegui salvar (armazenamento local indisponível)');
    return false;
  }
}

function updateStats() {
  watchedCountEl.textContent = watched.size;
  remainingCountEl.textContent = MOVIES.length - watched.size;
}

function updateWatchedBtn() {
  if (!current) return;
  const entry = watched.get(current.idx);
  const isWatched = !!entry;
  watchedBtn.textContent = isWatched ? '✔ Assistido' : '☐ Marcar como assistido';
  watchedBtn.classList.toggle('on', isWatched);
  const rating = (entry && typeof entry.rating === 'number') ? entry.rating : 0;
  renderStars(rating);
}

function renderStars(rating) {
  starWraps.forEach(wrap => {
    const pos = Number(wrap.dataset.pos);
    const fill = wrap.querySelector('.star-fill');
    let pct = 0;
    if (rating >= pos) pct = 100;
    else if (rating >= pos - 0.5) pct = 50;
    fill.style.width = pct + '%';
  });
  ratingLabel.textContent = rating > 0 ? formatRating(rating) + ' / 5' : 'Sem nota ainda';
}

function formatRating(r) {
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

function formatStarsText(r) {
  if (!r) return 'sem nota';
  return formatRating(r) + ' ★';
}

function renderRecent() {
  const entries = Array.from(watched.entries())
    .filter(([idx, v]) => v.watchedAt)
    .sort((a, b) => new Date(b[1].watchedAt) - new Date(a[1].watchedAt))
    .slice(0, 8);

  if (entries.length === 0) {
    recentList.innerHTML = '<div class="recent-empty">Você ainda não marcou nenhum filme como assistido.</div>';
    return;
  }

  recentList.innerHTML = entries.map(([idx, v]) => {
    const [rank, o, p, y] = MOVIES[idx];
    const name = (p || o).replace(/</g, '&lt;');
    const stars = formatStarsText(v.rating);
    return `<div class="recent-item">
      <div class="recent-info">
        <div class="recent-title">${name}</div>
        <div class="recent-meta">${y} · #${rank}</div>
      </div>
      <div class="recent-stars">${stars}</div>
    </div>`;
  }).join('');
}

function pickIndex() {
  const remaining = MOVIES.map((m, i) => i).filter(i => !watched.has(i));
  const pool = remaining.length > 0 ? remaining : MOVIES.map((m, i) => i);
  if (remaining.length === 0) showToast('Você já assistiu todos! Sorteando entre todos de novo 🎉');
  return pool[Math.floor(Math.random() * pool.length)];
}

function imdbSearchUrl(title) {
  return 'https://www.imdb.com/find/?q=' + encodeURIComponent(title) + '&s=tt&ttype=ft';
}

async function draw() {
  drawBtn.disabled = true;
  placeholder.style.display = 'none';
  resultBox.style.display = 'block';
  stage.classList.add('spinning');

  let ticks = 0;
  const maxTicks = 14;
  const interval = setInterval(() => {
    const randIdx = Math.floor(Math.random() * MOVIES.length);
    const [rank, o, p, y] = MOVIES[randIdx];
    titleEl.textContent = p || o;
    originalEl.textContent = '';
    yearEl.textContent = y;
    rankEl.textContent = '#' + rank;
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(interval);
      finalizeDraw();
    }
  }, 70);
}

function finalizeDraw() {
  const idx = pickIndex();
  const [rank, o, p, y] = MOVIES[idx];
  current = { idx, rank, original: o, ptTitle: p, year: y };
  titleEl.textContent = p || o;
  originalEl.textContent = (p && p !== o) ? ('Título original: ' + o) : '';
  yearEl.textContent = y;
  rankEl.textContent = '#' + rank + ' no Top 250';
  imdbLink.href = imdbSearchUrl(o);
  stage.classList.remove('spinning');
  updateWatchedBtn();
  drawBtn.disabled = false;
}

drawBtn.addEventListener('click', draw);

watchedBtn.addEventListener('click', async () => {
  if (!current) return;
  if (watched.has(current.idx)) {
    watched.delete(current.idx);
  } else {
    watched.set(current.idx, { rating: 0, watchedAt: new Date().toISOString() });
    showToast('Marcado como assistido ✔');
  }
  updateWatchedBtn();
  updateStats();
  renderRecent();
  await saveWatched();
});

starsBox.addEventListener('click', async (e) => {
  const btn = e.target.closest('.star-half');
  if (!btn) return;
  if (!current) {
    showToast('Sorteie um filme primeiro 🎲');
    return;
  }
  const clicked = parseFloat(btn.dataset.value);
  if (Number.isNaN(clicked)) return;

  const existing = watched.get(current.idx);
  const prevRating = (existing && typeof existing.rating === 'number') ? existing.rating : 0;
  const entry = existing || { rating: 0, watchedAt: null };

  // clicar na mesma nota já dada zera a nota; senão define a nova nota
  entry.rating = (prevRating === clicked) ? 0 : clicked;
  if (!entry.watchedAt) entry.watchedAt = new Date().toISOString();
  watched.set(current.idx, entry);

  updateWatchedBtn();
  updateStats();
  renderRecent();
  await saveWatched();
  showToast(entry.rating > 0 ? `Nota ${formatRating(entry.rating)} ★ salva` : 'Nota removida');
});

resetBtn.addEventListener('click', async () => {
  if (!resetBtn.dataset.confirming) {
    // primeiro clique: pede confirmação dentro do próprio app
    // (evita depender de confirm() do navegador, que fica bloqueado no artefato)
    resetBtn.dataset.confirming = '1';
    const original = resetBtn.textContent;
    resetBtn.textContent = 'Clique de novo para confirmar';
    resetBtn.style.color = 'var(--red)';
    clearTimeout(resetBtn._resetTimer);
    resetBtn._resetTimer = setTimeout(() => {
      delete resetBtn.dataset.confirming;
      resetBtn.textContent = original;
      resetBtn.style.color = '';
    }, 4000);
    return;
  }

  // segundo clique dentro do prazo: confirma e limpa de fato
  clearTimeout(resetBtn._resetTimer);
  delete resetBtn.dataset.confirming;
  resetBtn.textContent = 'Limpar lista de assistidos';
  resetBtn.style.color = '';

  watched = new Map();
  updateStats();
  renderRecent();
  if (current) updateWatchedBtn();
  await saveWatched();
  showToast('Lista de assistidos limpa');
});

loadWatched();
</script>
